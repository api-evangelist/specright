findings:
  - >-
    Quote-only pricing across all three tiers means neither a buyer nor an agent can
    estimate cost, and no rate or volume ceiling can be inferred from a plan.
  - >-
    Because no tier states an API allowance, there is no published relationship between what
    a customer pays and what the API will let them do.
