description: >-
  Specright publishes three named tiers and no prices. Every tier's call to action is "Get a
  Quote" — there is no list price, no currency, no billing period, no seat or record quota,
  and no published API allowance on any tier. The tier names and their target segments are
  real published facts; everything commercial is behind a sales conversation.
