  current_path_version: v1
  document_version: 1.1.0
  base_url: https://api.specright.com/v1
  first_released: '2020-02-13'
  first_release_evidence: https://www.specright.com/blog/specright-announces-api-developer-portal/
  note: >-
    The API has carried the same /v1 path since the 2020 launch. The reference title tracks
    a finer 1.1.0, but that number appears only in the rendered docs — it is not in a
    header, a media type or a machine-readable document.
  version_negotiation: none
  version_header: none

