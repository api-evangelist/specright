product_releases:
  cadence: >-
    Numbered releases (18.0 through 24.0) through 2023, then seasonal releases (Spring,
    Summer) from 2025 onward. Release 34 shipped as the Summer 2026 release.
  channel: company blog
  api_release_notes: false
  note: >-
    Product releases are announced as marketing blog posts about platform features. None of
    them is an API changelog — no release post enumerates API changes, added operations or
    breaking changes. See ../changelog/specright-changelog.yml.

change_communication:
  api_changelog: false
  breaking_change_notice: none published
  email_notification: not documented
  note: >-
    There is no published mechanism by which an API consumer learns that the API changed.
    Because tenant field metadata is served live from the /definition endpoints, some schema
    change reaches consumers without any announcement at all.

gaps:
  - No deprecation policy and no Sunset/Deprecation headers.
  - The status page is real and good, but is not linked from any Specright property —
    www.specright.com/status/ 404s and neither the docs nor the portal reference it.
  - No SLA.
  - No API-level changelog or release notes.
  - The /health endpoints are live but undocumented.
