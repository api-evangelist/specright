name: Specright API lifecycle
description: >-
  Specright versions its API in the path and its product in numbered/seasonal releases
  announced on the company blog. What it does not publish is any of the machinery a
  consumer needs to plan around change: no deprecation policy, no sunset headers, no
  status page, no SLA, and no per-operation deprecation markers.

