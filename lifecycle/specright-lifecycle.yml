  subscription: Email notifications with OTP confirmation.
  note: >-
    A real, actively maintained Statuspage with a dedicated "Specright API Services"
    component and a public JSON API an agent can poll unauthenticated. It also carries
    third-party service notices (a Conga authentication disruption was posted and resolved
    on 2026-08-25) and links out to Salesforce Platform Status, reflecting Specright's
    Salesforce foundation.
  discovery_gap: >-
    Nothing links to it. https://www.specright.com/status/ returns 404, the status host is
    not referenced from the marketing site navigation, the developer portal, or the API
    reference. It was found only by probing the conventional subdomain. Surfacing it from
    the developer portal would cost nothing and is the single cheapest documentation fix
    available to Specright.

sla:
  published: false
  note: >-
    No uptime commitment, support-response target or SLA document is published. Pricing is
    quote-only across all three tiers, so any SLA is presumably contractual.

