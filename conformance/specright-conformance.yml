    - {url: 'https://www.specright.com/trust/', status: 404}
  note: >-
    No SOC 2, ISO 27001, PCI, HIPAA or FedRAMP claim was found on any public Specright page,
    and no trust center exists. Because nothing is published, no Compliance pointer is
    emitted. This records an absence of published evidence, not an absence of certification —
    an enterprise SaaS vendor of this size very likely holds SOC 2, but it is not public.

