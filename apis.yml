apis:
- name: Specright API
  description: >-
    REST API over Specright's specification data. Forty-six operations across six areas:
    token issuance, specifications, spec families (BOM / finished good), suppliers, a
    generic /objects/{api-name} endpoint that reaches any Specright object configured in
    the tenant, and asynchronous bulk jobs. Every collection supports sparse fieldsets
    (fields), JSON filter queries (filter), sort, and skip/limit pagination; every record
    supports upsert against a configurable Salesforce external ID; and every object exposes
    a /definition endpoint returning its field metadata. Authentication is an API key plus a
    mandatory x-user-id acting-principal header, or a bearer token from POST /v1/token.
  humanURL: https://developer.specright.com/
  baseURL: https://api.specright.com/v1
