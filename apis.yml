aid: specright
name: Specright
description: >-
  Specright is a specification data management (SDM) platform that centralizes the
  specifications behind a physical product — raw materials, ingredients, formulas,
  packaging components, finished goods and the bills of materials that connect them — and
  shares them across a company's suppliers, co-manufacturers and internal teams. Founded in
  2015 and headquartered in Tustin, California, the platform is built on Salesforce, which
  surfaces directly in its API: records are addressed by Salesforce IDs or by a configurable
  external ID, and field names carry the specright__*__c managed-package prefix. Specright
  publishes a REST API at api.specright.com/v1 covering specifications, spec families,
  suppliers, a generic object endpoint that reaches any configured Specright object, file
  retrieval and asynchronous CSV bulk jobs, documented through a developer portal at
  developer.specright.com. It also serves an OAuth-protected Model Context Protocol
  endpoint from its marketing site.
