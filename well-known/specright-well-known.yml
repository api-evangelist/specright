  - host: www.specright.com
    note: >-
      WordPress (Pantheon origin behind Cloudflare). The two OAuth documents are served
      by the WordPress MCP adapter plugin and are the discovery surface for the MCP
      server at /wp-json/mcp/mcp-oauth-server. Both paths 301 to a trailing-slash form
      before returning 200, so a probe that does not follow redirects records a false
      miss. Note the site's robots.txt disallows /wp-json/, so the MCP endpoint the
      protected-resource document names is itself excluded from crawlers.
    documents:
      - path: /.well-known/oauth-authorization-server
        status: 200
        content_type: application/json
        file: specright-www-oauth-authorization-server.json
        note: >-
