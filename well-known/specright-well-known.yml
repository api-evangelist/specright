          + refresh_token grants, and client_id_metadata_document_supported: true. Token
          endpoint auth method is "none" (public clients only).
      - path: /.well-known/oauth-protected-resource
        status: 200
        content_type: application/json
        file: specright-www-oauth-protected-resource.json
        note: >-
          RFC 9728 protected-resource metadata naming
          https://www.specright.com/wp-json/mcp/mcp-oauth-server as the protected resource.
          This is the document the MCP server's 401 WWW-Authenticate header points at.
      - path: /.well-known/security.txt
