  (sandbox API), developer.specright.com (developer portal SPA) and login.specright.com
  (Keycloak identity provider).
name: Specright well-known documents
description: >-
  Specright serves real /.well-known documents from two hosts. login.specright.com
  publishes a full Keycloak OpenID Connect discovery document for the "Specright" realm
  (the identity provider behind the api.specright.com bearer-token flow), and
  www.specright.com publishes RFC 8414 authorization-server metadata plus an RFC 9728
  protected-resource document that advertise an OAuth-protected Model Context Protocol
  server on the marketing site's WordPress REST API. The API host itself
  (api.specright.com) serves no /.well-known documents at all.

hosts:
  - host: login.specright.com
    note: >-
      Keycloak identity provider. The realm-scoped discovery paths answer; the host-root
      /.well-known/* paths return a Keycloak 404 JSON body ("Unable to find matching
      target resource"), which is the expected shape for a realm-scoped deployment.
    documents:
      - path: /realms/Specright/.well-known/openid-configuration
        status: 200
        content_type: application/json
        file: specright-login-openid-configuration.json
        note: >-
          Full OIDC discovery document for the Specright realm. Feeds
          authentication/specright-authentication.yml and scopes/specright-scopes.yml.
      - path: /realms/Specright/.well-known/oauth-authorization-server
        status: 200
        content_type: application/json
        file: specright-login-oauth-authorization-server.json
        note: >-
          RFC 8414 authorization-server metadata. Byte-identical to the OIDC discovery
          document above, which is standard Keycloak behaviour.
