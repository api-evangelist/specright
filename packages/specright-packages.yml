findings:
  - >-
    Zero first-party SDKs across six registries, and zero public repositories in a GitHub
    organization that has been open for seven years.
  - >-
    For an API whose response envelope is an array of untyped field/label/value triples
    requiring a runtime /definition lookup before use, the absence of any client library is a
    meaningful adoption cost — every integrator writes the same metadata-resolution layer.
