grounding_note: >-
  Specright publishes no OpenAPI document, so these skills are grounded in method+path
  identifiers rather than operationIds — the published reference has no operationIds to
  cite. Its anchors take the form "opId GET /specs", which is the widdershins fallback used
  when a source spec omits operationId. Every path, method, parameter, status code and
  documented default below appears verbatim in the reference at
  https://developer.specright.com/api-reference.

